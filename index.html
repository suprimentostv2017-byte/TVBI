<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>TV - Power BI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        .pagina {
            position: absolute;
            top: 0;
            left: 0;

            width: 100vw;
            height: 100vh;

            opacity: 0;
            visibility: hidden;

            transition: opacity 1s ease;
        }

        .pagina.ativa {
            opacity: 1;
            visibility: visible;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body>

    <!-- PÁGINA 1 -->
    <div class="pagina ativa">

        <iframe
            src="https://app.powerbi.com/reportEmbed?reportId=06f06ba9-5c9d-409c-b134-7935c9755efc&autoAuth=true&ctid=5367a55c-9b5a-4c6c-97e0-bac44bae1b2c&pageName=dca02322500d863501ce"
            allowfullscreen="true">
        </iframe>

    </div>


    <!-- PÁGINA 2 -->
    <div class="pagina">

        <iframe
            src="https://app.powerbi.com/reportEmbed?reportId=06f06ba9-5c9d-409c-b134-7935c9755efc&autoAuth=true&ctid=5367a55c-9b5a-4c6c-97e0-bac44bae1b2c&pageName=b5fcd97b06c0b2cb5e88"
            allowfullscreen="true">
        </iframe>

    </div>


 <div class="pagina">

        <iframe
            src="https://app.powerbi.com/reportEmbed?reportId=06f06ba9-5c9d-409c-b134-7935c9755efc&autoAuth=true&ctid=5367a55c-9b5a-4c6c-97e0-bac44bae1b2c&pageName=aa171c230d1602cd0e4"
            allowfullscreen="true">
        </iframe>

    </div>




    <script>

       
    const paginas = document.querySelectorAll(".pagina");
    let paginaAtual = 0;

    const tempoTroca = 60000;            // 1 min em cada página
    const tempoRecarga = 40 * 60000;     // recarrega cada relatório a cada 40 min
    const ultimaRecarga = Array.from(paginas, () => Date.now());

    setInterval(() => {
        paginas[paginaAtual].classList.remove("ativa");
        paginaAtual = (paginaAtual + 1) % paginas.length;
        paginas[paginaAtual].classList.add("ativa");

        // Recarrega só a página que acabou de sair da tela, se já passou do tempo
        const anterior = (paginaAtual - 1 + paginas.length) % paginas.length;
        if (Date.now() - ultimaRecarga[anterior] > tempoRecarga) {
            const iframe = paginas[anterior].querySelector("iframe");
            iframe.src = iframe.src;
            ultimaRecarga[anterior] = Date.now();
        }
    }, tempoTroca);


    </script>

</body>

</html>
